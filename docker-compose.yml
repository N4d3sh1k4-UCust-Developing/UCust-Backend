name: ucust-app

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# --- Память JVM -------------------------------------------------------------
# ВАЖНО: Dockerfile'ы используют exec-форму ENTRYPOINT
#   ENTRYPOINT ["java", "-Dspring.profiles.active=prod", "-jar", "app.jar"]
# поэтому переменная JAVA_OPTS в командную строку не подставляется и JVM её не
# видит. Рабочий вариант — JAVA_TOOL_OPTIONS: JVM читает её сама, без изменения
# образа. Без неё heap считается эргономикой (25 % от memory-лимита контейнера).
#
# Правило: memory-лимит = Xmx + ~200 МБ на metaspace/code cache/стеки/direct.
# Значения подобраны по фактическим пикам cgroup на rinhbaby (2026-11-02):
#   light  Xmx128 — api-gateway, audit-log, notification
#   medium Xmx160 — user, business, content, billing
#   heavy  Xmx192 — security, generative-orchestration
# Сумма лимитов 9 сервисов ≈ 3.3 ГБ (фактическое потребление ≈ 2.4 ГБ).
# Свободный слот под 10-й сервис: medium + 384M.
# ----------------------------------------------------------------------------

networks:
  ucust-net:
    external: true

services:
  api-gateway:
    image: ghcr.io/n4d3sh1k4-ucust-developing/api-gateway:latest
    container_name: api-gateway-ucust
    ports:
      - "8100:8100"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx128m -Xss512k -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=64m -XX:+ExitOnOutOfMemoryError
      - JWT_SECRET_ACCESS=${JWT_SECRET_ACCESS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://ucust.ru,https://www.ucust.ru,https://adm.ucust.n4d3sh1k4.site,https://svoadmin.ucust.ru}
      - PGADMIN_URI=http://pgadmin-ucust:80
      - RABBITMQ_ADMIN_URI=http://rabbitmq-ucust:15672
      - MINIO_ADMIN_URI=http://minio-ucust:9001
      - MINIO_S3_URI=http://minio:9000
      - SERVICES_DOZZLE_URI=http://dozzle-ucust:8080
    networks:
      - ucust-net
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 288M

  security-service:
    image: ghcr.io/n4d3sh1k4-ucust-developing/security-service:latest
    container_name: security-service-ucust
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - RABBITMQ_USER=${RABBITMQ_USER:-service-user}
      - RABBITMQ_PASS=${RABBITMQ_PASS:-servicepassword}
      - JAVA_TOOL_OPTIONS=-Xms96m -Xmx192m -Xss512k -XX:MaxMetaspaceSize=224m -XX:ReservedCodeCacheSize=96m -XX:+ExitOnOutOfMemoryError
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-${DB_PASSWORD}}
      - POSTGRES_USER=${POSTGRES_USER:-ETA_DBUser}
      - JWT_SECRET_ACCESS=${JWT_SECRET_ACCESS}
      - YANDEX_CLIENT_ID=${YANDEX_CLIENT_ID}
      - YANDEX_CLIENT_SECRET=${YANDEX_CLIENT_SECRET}
      - VK_CLIENT_ID=${VK_CLIENT_ID}
      - VK_CLIENT_SECRET=${VK_CLIENT_SECRET}
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD}
      - GEO_API_URL=${GEO_API_URL}
      - APP_OAUTH2_REDIRECT_URI=${APP_OAUTH2_REDIRECT_URI:-https://api.ucust.ru/api/v0/login/oauth2/code/{registrationId}}
    networks:
      - ucust-net
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 448M

  user-service:
    image: ghcr.io/n4d3sh1k4-ucust-developing/user-service:latest
    container_name: user-service-ucust
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - RABBITMQ_USER=${RABBITMQ_USER:-service-user}
      - RABBITMQ_PASS=${RABBITMQ_PASS:-servicepassword}
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx160m -Xss512k -XX:MaxMetaspaceSize=224m -XX:ReservedCodeCacheSize=64m -XX:+ExitOnOutOfMemoryError
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-${DB_PASSWORD}}
      - POSTGRES_USER=${POSTGRES_USER:-ETA_DBUser}
      - SERVER_TAILSCALE_IP=${SERVER_TAILSCALE_IP}
      - MINIO_ACCESS_KEY=${USER_MINIO_ACCESS_KEY:-user-service-user}
      - MINIO_SECRET_KEY=${USER_MINIO_SECRET_KEY:-usr-strong-pass}
    networks:
      - ucust-net
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 384M

  business-service:
    image: ghcr.io/n4d3sh1k4-ucust-developing/business-service:latest
    container_name: business-service-ucust
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - RABBITMQ_USER=${RABBITMQ_USER:-service-user}
      - RABBITMQ_PASS=${RABBITMQ_PASS:-servicepassword}
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx160m -Xss512k -XX:MaxMetaspaceSize=224m -XX:ReservedCodeCacheSize=64m -XX:+ExitOnOutOfMemoryError
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-${DB_PASSWORD}}
      - POSTGRES_USER=${POSTGRES_USER:-ETA_DBUser}
      - SERVER_TAILSCALE_IP=${SERVER_TAILSCALE_IP}
      - MINIO_ACCESS_KEY=${BUSINESS_MINIO_ACCESS_KEY:-business-service-user}
      - MINIO_SECRET_KEY=${BUSINESS_MINIO_SECRET_KEY:-bus-strong-pass}
    networks:
      - ucust-net
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 384M

  content-service:
    image: ghcr.io/n4d3sh1k4-ucust-developing/content-service:latest
    container_name: content-service-ucust
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx160m -Xss512k -XX:MaxMetaspaceSize=224m -XX:ReservedCodeCacheSize=64m -XX:+ExitOnOutOfMemoryError
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-${DB_PASSWORD}}
      - POSTGRES_USER=${POSTGRES_USER:-ETA_DBUser}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://minio:9000}
      - MINIO_ACCESS_KEY=${CONTENT_MINIO_ACCESS_KEY:-content-service-user}
      - MINIO_SECRET_KEY=${CONTENT_MINIO_SECRET_KEY:-ct-strong-pass}
      - MINIO_PUBLIC_BASE_URL=${CONTENT_MINIO_PUBLIC_BASE_URL:-https://api.ucust.ru/s3/content-service}
    networks:
      - ucust-net
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 384M

  audit-log-service:
    image: ghcr.io/n4d3sh1k4-ucust-developing/audit-log-service:latest
    container_name: audit-log-service-ucust
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - RABBITMQ_USER=${RABBITMQ_USER:-service-user}
      - RABBITMQ_PASS=${RABBITMQ_PASS:-servicepassword}
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx128m -Xss512k -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=64m -XX:+ExitOnOutOfMemoryError
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-${DB_PASSWORD}}
      - POSTGRES_USER=${POSTGRES_USER:-ETA_DBUser}
    networks:
      - ucust-net
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 288M

  notification-service:
    image: ghcr.io/n4d3sh1k4-ucust-developing/notification-service:latest
    container_name: notification-service-ucust
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - RABBITMQ_USER=${RABBITMQ_USER:-service-user}
      - RABBITMQ_PASS=${RABBITMQ_PASS:-servicepassword}
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx160m -Xss512k -XX:MaxMetaspaceSize=224m -XX:ReservedCodeCacheSize=64m -XX:+ExitOnOutOfMemoryError
      - SUPPORT_EMAIL=${SUPPORT_EMAIL}
      - FRONTEND_URL=${FRONTEND_URL}
      - MAIL_HOST=${MAIL_HOST:-sandbox.smtp.mailtrap.io}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-a9f3052b45461a}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-ae4e25c063dcb8}
      - MAIL_SSL=${MAIL_SSL:-false}
      - MAIL_FROM=${MAIL_FROM:-}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-UCust}
    networks:
      - ucust-net
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 288M

  billing-service:
    image: ghcr.io/n4d3sh1k4-ucust-developing/billing-service:latest
    container_name: billing-service-ucust
    ports:
      - "8106:8106"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - RABBITMQ_USER=${RABBITMQ_USER:-service-user}
      - RABBITMQ_PASS=${RABBITMQ_PASS:-servicepassword}
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx160m -Xss512k -XX:MaxMetaspaceSize=224m -XX:ReservedCodeCacheSize=64m -XX:+ExitOnOutOfMemoryError
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-${DB_PASSWORD}}
      - POSTGRES_USER=${POSTGRES_USER:-ETA_DBUser}
      - JWT_SECRET_ACCESS=${JWT_SECRET_ACCESS}
      - QUOTA_FREE_UNLIMITED=${QUOTA_FREE_UNLIMITED:-false}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
    networks:
      - ucust-net
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 384M

  generative-orchestration-service:
    image: ghcr.io/n4d3sh1k4-ucust-developing/generative-orchestration-service:latest
    container_name: generative-orchestration-service-ucust
    ports:
      - "8107:8107"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - RABBITMQ_USER=${RABBITMQ_USER:-service-user}
      - RABBITMQ_PASS=${RABBITMQ_PASS:-servicepassword}
      - JAVA_TOOL_OPTIONS=-Xms96m -Xmx192m -Xss512k -XX:MaxMetaspaceSize=224m -XX:ReservedCodeCacheSize=96m -XX:+ExitOnOutOfMemoryError
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-${DB_PASSWORD}}
      - POSTGRES_USER=${POSTGRES_USER:-ETA_DBUser}
      - JWT_SECRET_ACCESS=${JWT_SECRET_ACCESS}
      # Адреса внутренних сервисов: по умолчанию имена контейнеров в ucust-net.
      # Переопределять только для отладки (напр. направить в staging).
      - BUSINESS_SERVICE_URI=${BUSINESS_SERVICE_URI:-http://business-service:8104}
      - BILLING_SERVICE_URI=${BILLING_SERVICE_URI:-http://billing-service:8106}
      - AI_SERVICE_URI=${AI_SERVICE_URI}
      - AI_ORCHESTRATOR_ENDPOINT=${AI_ORCHESTRATOR_ENDPOINT}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://minio:9000}
      - MINIO_ACCESS_KEY=${GEN_ORCHESTRATION_MINIO_ACCESS_KEY:-generative-orchestration-user}
      - MINIO_SECRET_KEY=${GEN_ORCHESTRATION_MINIO_SECRET_KEY:-gen-strong-pass}
      - MINIO_PUBLIC_BASE_URL=${MINIO_PUBLIC_BASE_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_BOT_PROXY=${TELEGRAM_BOT_PROXY:-http://xray:1080}
    networks:
      - ucust-net
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 448M

  # Локальный VLESS-клиент (MagnumVPN): подписка MagnumVPN → TUN -> HTTP-прокси
  # внутри ucust-net. Нужен только для верификации соцсетей с rinhbaby (RU-сеть,
  # api.telegram.org блокируется напрямую). Конфиг (нода + UUID) правится вручную
  # на сервере: /home/n4d3sh1k4/projects/ucust/xray/config.json (не в git).
  xray:
    image: teddysun/xray:latest
    container_name: xray-ucust
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - /home/n4d3sh1k4/projects/ucust/xray/config.json:/etc/xray/config.json:ro
    networks:
      - ucust-net
    deploy:
      resources:
        limits:
          memory: 64M