name: ucust-app

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  ucust-net:
    external: true

services:
  api-gateway:
    image: ghcr.io/n4d3sh1k4-ucust-developing/api-gateway:latest
    container_name: api-gateway-ucust
    ports:
      - "8100:8100"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xmx256m -Xms128m
      - JWT_SECRET_ACCESS=${JWT_SECRET_ACCESS}
      - PGADMIN_URI=http://pgadmin-ucust:80
      - RABBITMQ_ADMIN_URI=http://rabbitmq-ucust:15672
      - MINIO_ADMIN_URI=http://minio-ucust:9001
      - MINIO_S3_URI=http://minio:9000
      - SERVICES_DOZZLE_URI=http://dozzle-ucust:8080
    networks:
      - ucust-net
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 384M

  security-service:
    image: ghcr.io/n4d3sh1k4-ucust-developing/security-service:latest
    container_name: security-service-ucust
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xmx512m -Xms256m
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET_ACCESS=${JWT_SECRET_ACCESS}
      - YANDEX_CLIENT_ID=${YANDEX_CLIENT_ID}
      - YANDEX_CLIENT_SECRET=${YANDEX_CLIENT_SECRET}
      - VK_CLIENT_ID=${VK_CLIENT_ID}
      - VK_CLIENT_SECRET=${VK_CLIENT_SECRET}
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD}
      - GEO_API_URL=${GEO_API_URL}
    networks:
      - ucust-net
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 768M

  user-service:
    image: ghcr.io/n4d3sh1k4-ucust-developing/user-service:latest
    container_name: user-service-ucust
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xmx512m -Xms256m
      - DB_PASSWORD=${DB_PASSWORD}
      - SERVER_TAILSCALE_IP=${SERVER_TAILSCALE_IP}
      - MINIO_ACCESS_KEY=${USER_MINIO_ACCESS_KEY:-admin}
      - MINIO_SECRET_KEY=${USER_MINIO_SECRET_KEY:-password123}
    networks:
      - ucust-net
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M

  business-service:
    image: ghcr.io/n4d3sh1k4-ucust-developing/business-service:latest
    container_name: business-service-ucust
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xmx512m -Xms256m
      - DB_PASSWORD=${DB_PASSWORD}
      - SERVER_TAILSCALE_IP=${SERVER_TAILSCALE_IP}
    networks:
      - ucust-net
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M

  notification-service:
    image: ghcr.io/n4d3sh1k4-ucust-developing/notification-service:latest
    container_name: notification-service-ucust
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xmx512m -Xms256m
      - SUPPORT_EMAIL=${SUPPORT_EMAIL}
      - FRONTEND_URL=${FRONTEND_URL}
      - MAIL_HOST=${MAIL_HOST:-sandbox.smtp.mailtrap.io}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-a9f3052b45461a}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-ae4e25c063dcb8}
      - MAIL_SSL=${MAIL_SSL:-false}
      - MAIL_FROM=${MAIL_FROM:-}
    networks:
      - ucust-net
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 412M

  billing-service:
    image: ghcr.io/n4d3sh1k4-ucust-developing/billing-service:latest
    container_name: billing-service-ucust
    ports:
      - "8106:8106"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xmx512m -Xms256m
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET_ACCESS=${JWT_SECRET_ACCESS}
      - QUOTA_FREE_UNLIMITED=${QUOTA_FREE_UNLIMITED:-false}
    networks:
      - ucust-net
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M

  generative-orchestration-service:
    image: ghcr.io/n4d3sh1k4-ucust-developing/generative-orchestration-service:latest
    container_name: generative-orchestration-service-ucust
    ports:
      - "8107:8107"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xmx512m -Xms256m
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET_ACCESS=${JWT_SECRET_ACCESS}
      - AI_SERVICE_URI=${AI_SERVICE_URI}
      - AI_ORCHESTRATOR_ENDPOINT=${AI_ORCHESTRATOR_ENDPOINT}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_PUBLIC_BASE_URL=${MINIO_PUBLIC_BASE_URL}
    networks:
      - ucust-net
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M